<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad Dashboard v9</title>
  <style>
    body {
      margin:0;
      padding:0;
      height:100vh;
      width:100vw;
      background-color:black;
      color:white;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:flex-start;
      padding:20px;
    }
    #time { font-size:120px; font-weight:600; }
    #date { font-size:40px; margin-top:10px; }
    #weekday { font-size:30px; margin-top:5px; }
    #version-badge { position:fixed; top:12px; right:12px; background:rgba(255,255,255,0.08); color:#fff; padding:6px 10px; border-radius:6px; font-size:13px; border:1px solid rgba(255,255,255,0.04); box-shadow:0 2px 6px rgba(0,0,0,0.6);}
  </style>
</head>
<body>
  <div id="time">--:--:--</div>
  <div id="date">Loading date...</div>
  <div id="weekday"></div>
  <div id="version-badge">v9</div>

  <script>
    // Simple array for weekday names
    var weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

    function updateTime() {
      var now = new Date();
      var hours = now.getHours() % 12 || 12;
      var minutes = (now.getMinutes() < 10 ? "0" : "") + now.getMinutes();
      var seconds = (now.getSeconds() < 10 ? "0" : "") + now.getSeconds();
      var ampm = now.getHours() >= 12 ? "pm" : "am";

      document.getElementById('time').innerText = hours + ":" + minutes + ":" + seconds + ampm;
      document.getElementById('date').innerText = now.getMonth()+1 + "/" + now.getDate() + "/" + now.getFullYear();
      document.getElementById('weekday').innerText = weekdays[now.getDay()];
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
