<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad Dashboard v11</title>
  <style>
    body {
      margin:0;
      padding:20px;
      height:100vh;
      width:100vw;
      background-color:black;
      color:white;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    }
    #time { font-size:120px; font-weight:600; }
    #date { font-size:40px; margin-top:10px; }
    #weekday { font-size:30px; margin-top:5px; }
    #version-badge {
      position:fixed;
      top:12px;
      right:12px;
      background:rgba(255,255,255,0.08);
      color:#fff;
      padding:6px 10px;
      border-radius:6px;
      font-size:13px;
      border:1px solid rgba(255,255,255,0.04);
      box-shadow:0 2px 6px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="time">--:--:--</div>
  <div id="date">Loading date...</div>
  <div id="weekday">Loading weekday...</div>
  <div id="version-badge">v11</div>

  <script>
    window.onload = function() {
      // Background images
      var images = [
        "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG1.png",
        "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG2.png",
        "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG3.png",
        "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG4.png",
        "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG5.png",
        "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG6.png"
      ];
      var randomIndex = Math.floor(Math.random() * images.length);
      document.body.style.backgroundImage = "url('" + images[randomIndex] + "')";
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center center";

      // Update time and date
      function updateTime() {
        var now = new Date();
        var hours = now.getHours() % 12;
        if(hours === 0) hours = 12;
        var minutes = now.getMinutes();
        if(minutes < 10) minutes = "0" + minutes;
        var seconds = now.getSeconds();
        if(seconds < 10) seconds = "0" + seconds;
        var ampm = now.getHours() >= 12 ? "pm" : "am";
        document.getElementById('time').innerText = hours + ":" + minutes + ":" + seconds + ampm;
        document.getElementById('date').innerText = now.toDateString();
        var weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
        document.getElementById('weekday').innerText = weekdays[now.getDay()];
      }
      updateTime();
      setInterval(updateTime, 1000);
    };
  </script>
</body>
</html>
