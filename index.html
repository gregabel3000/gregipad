<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPad Dashboard v10</title>
  <style>
    body {
      margin:0;
      padding:20px;
      height:100vh;
      width:100vw;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:flex-start;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
      color:white;
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    #time { 
      font-size:120px; 
      font-weight:600; 
      /* Optional: text-shadow for visibility over images */
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7); 
    }
    #date { 
      font-size:40px; 
      margin-top:10px; 
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7); 
    }
    #day { 
      font-size:30px; 
      margin-top:5px; 
      text-shadow: 1px 1px 4px rgba(0,0,0,0.7); 
    }
    #version-badge { 
      position:fixed; 
      top:12px; 
      right:12px; 
      background:rgba(255,255,255,0.08); 
      color:#fff; 
      padding:6px 10px; 
      border-radius:6px; 
      font-size:13px; 
      border:1px solid rgba(255,255,255,0.04); 
      box-shadow:0 2px 6px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="time">--:--:--</div>
  <div id="date">Loading date...</div>
  <div id="day"></div>
  <div id="version-badge">v10</div>

  <script>
    // --- Random Background ---
    const images = [
      "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG1.PNG",
      "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG2.PNG",
      "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG3.PNG",
      "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG4.PNG",
      "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG5.PNG",
      "https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG6.PNG"
    ];
    const randomIndex = Math.floor(Math.random() * images.length);
    document.body.style.backgroundImage = `url('${images[randomIndex]}')`;

    // --- Update Time, Date, Day ---
    function updateTime() {
      const now = new Date();
      const hours = now.getHours() % 12 || 12;
      const minutes = String(now.getMinutes()).padStart(2,'0');
      const seconds = String(now.getSeconds()).padStart(2,'0');
      const ampm = now.getHours() >= 12 ? 'pm' : 'am';
      document.getElementById('time').innerText = `${hours}:${minutes}:${seconds}${ampm}`;
      document.getElementById('date').innerText = now.toDateString();
      const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      document.getElementById('day').innerText = days[now.getDay()];
    }

    updateTime();
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
