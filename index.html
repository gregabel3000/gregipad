<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iPad Dashboard v16</title>
  <style>
    html, body {
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background-color:black;
      font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    }
    body {
      color:white;
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      justify-content:flex-start;
      padding:20px;
     text-shadow: 2px 2px 6px rgba(0,0,0,0.6), 0 0 10px rgba(0,0,0,0.3);
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transition: background-image 1s ease-in-out;
    }
    #time { font-size:120px; font-weight:600; }
    #date { font-size:40px; margin-top:10px; }
    #day { font-size:36px; margin-top:5px; }
    #version-badge {
      position:fixed;
      top:12px;
      right:12px;
      background:rgba(255,255,255,0.08);
      color:#fff;
      padding:6px 10px;
      border-radius:6px;
      font-size:13px;
      border:1px solid rgba(255,255,255,0.04);
      box-shadow:0 2px 6px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="time">--:--:--</div>
  <div id="date">Loading date...</div>
  <div id="day">Loading day...</div>
  <div id="version-badge">v16</div>

  <script>
    // Background images
    var images = [];
    for(var i=1; i<=32; i++){
      images.push("https://raw.githubusercontent.com/gregabel3000/gregipad/refs/heads/main/images/BG" + i + ".png");
    }

    // Pick random background
    function pickBackground() {
      var idx = Math.floor(Math.random() * images.length);
      document.body.style.backgroundImage = "url('" + images[idx] + "')";
    }
    pickBackground();

    // Update time and date
    function updateTime() {
      var now = new Date();
      var hours = now.getHours() % 12;
      if(hours === 0) { hours = 12; }
      var minutes = now.getMinutes();
      if(minutes < 10) { minutes = "0" + minutes; }
      var seconds = now.getSeconds();
      if(seconds < 10) { seconds = "0" + seconds; }
      var ampm = now.getHours() >= 12 ? 'pm' : 'am';
      document.getElementById('time').innerText = hours + ":" + minutes + ":" + seconds + ampm;

      var month = now.getMonth() + 1;
      var dayNum = now.getDate();
      var year = now.getFullYear();
      document.getElementById('date').innerText = month + "/" + dayNum + "/" + year;

      var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      document.getElementById('day').innerText = days[now.getDay()];
    }

    updateTime();
    setInterval(updateTime, 1000);

    // Reload at 1:00 AM
    function scheduleReload() {
      var now = new Date();
      var next = new Date();
      next.setHours(1,0,0,0); // 1:00 AM today
      if(next <= now){
        next.setDate(next.getDate() + 1); // if already past 1 AM, schedule for tomorrow
      }
      var timeout = next - now;
      setTimeout(function(){
        location.reload();
      }, timeout);
    }
    scheduleReload();
  </script>
</body>
</html>
